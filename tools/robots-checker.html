<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Free robots.txt checker: paste robots.txt + a path, see the allow/block verdict.">
<title>Robots.txt Checker - free tool</title>
<style>
body{font-family:system-ui,sans-serif;max-width:860px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}
textarea{width:100%;height:200px;font-family:monospace;font-size:13px;border:1px solid #ccc;border-radius:6px;padding:10px;box-sizing:border-box}
input[type=text]{width:100%;padding:8px;font-family:monospace;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#0a5fd0;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;cursor:pointer;margin:8px 4px 8px 0}
#out{font-family:monospace;font-size:14px;background:#f6f8fa;border-radius:6px;padding:12px;margin-top:10px}
.allowed{color:#0a7d3c;font-weight:700}.blocked{color:#c00;font-weight:700}
</style></head><body>
<h1>Robots.txt Checker</h1>
<p>Paste a robots.txt and a URL path to see if your crawler is allowed. Free tool by <a href="../index.html">nativebranch</a>.</p>
<textarea id="rt" placeholder="User-agent: *
Disallow: /admin/
Disallow: /search"></textarea>
<input type="text" id="path" placeholder="/products/chair" value="/products/chair">
<br>
<button onclick="check()">Check</button>
<div id="out"></div>
<script>
function check() {
  var txt = document.getElementById('rt').value;
  var path = document.getElementById('path').value;
  var rules = [];
  txt.split(/\r?\n/).forEach(function(l){
    l = l.trim();
    if (l.startsWith('Disallow:')) rules.push(l.slice(9).trim());
    if (l.startsWith('Allow:')) rules.push('ALLOW:' + l.slice(6).trim());
  });
  var verdict = 'allowed';
  rules.forEach(function(r){
    if (r.startsWith('ALLOW:')) return;
    if (r === '' ) { if (path !== '') {} }
    if (r !== '' && path.startsWith(r)) verdict = 'blocked';
  });
  var out = '<span class="' + (verdict === 'allowed' ? 'allowed' : 'blocked') + '">' + verdict.toUpperCase() + '</span> for ' + path;
  if (rules.length) out += '\n\nrules: ' + rules.join(', ');
  document.getElementById('out').innerHTML = out;
}
</script>
<p><small><a href="../products.html">Catalog</a> · <a href="https://futureparse.com/guides">Free guides</a></small></p>
</body></html>
